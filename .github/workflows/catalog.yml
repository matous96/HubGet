# Katalog aplikací a web zdarma na GitHub Pages:
#   https://hubget.eu/              – web HubGetu (složka website/)
#   https://hubget.eu/catalog.json  – katalog aplikací
# (vlastní doména v Settings → Pages; matous96.github.io/unibox na ni přesměruje)
# Katalog denně vygeneruje data pipeline. Odtud si ho stahují nainstalované HubGet
# (výchozí VITE_CATALOG_URL v sestavené aplikaci) a přibalí ho workflow Vydání.
# Změna webu v main se zveřejní hned – s posledním zveřejněným katalogem, bez pipeline.
#
# Pages posílá katalog komprimovaný (16 MB → ~3,5 MB) s ETagem, takže opakované
# stažení beze změny je jen krátká odpověď 304. Mezipaměť pipeline (stažené zdroje,
# rozměry ikon, ikony webů, „první výskyt“ aplikací) se drží v mezipaměti Actions –
# první běh trvá kolem 45 minut (hlavně ikony z webů aplikací), další pár minut.
#
# Malé ikony (48–127 px) zvětší Real-ESRGAN na procesoru (softwarový Vulkan) a web je
# zveřejní na https://hubget.eu/icons/ – každý běh nejvýš UPSCALE_MINUTES, zbytek další.
#
# Nastavení (jednou): Settings → Pages → Build and deployment → Source: GitHub Actions.
# Spustit jde i ručně: Actions → Katalog → Run workflow (vždy s novým katalogem).

name: Katalog
run-name: "${{ github.event_name == 'schedule' && 'Katalog – denní aktualizace' || github.event_name == 'push' && 'Web – aktualizace' || 'Katalog – ruční spuštění' }}"

on:
  schedule:
    - cron: "23 2 * * *" # každý den
  workflow_dispatch:
  push:
    branches: [main]
    # Změna pipeline (i kódu, který sdílí s aplikací) vygeneruje nový katalog hned – ne až v noci
    paths: ["website/**", ".github/workflows/catalog.yml", "data-pipeline/**", "src/lib/verified.ts", "src/lib/wingetVariant.ts"]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Sestavení katalogu a webu
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PAGES_CATALOG_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/catalog.json
    steps:
      - uses: actions/checkout@v4
        with:
          # Push: celá historie – krok „Katalog z GitHub Pages“ porovná změněné soubory
          fetch-depth: ${{ github.event_name == 'push' && 0 || 1 }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Pipeline potřebuje node:sqlite a spouštění TypeScriptu bez sestavení (Node 24)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Jen změna webu: zveřejněný katalog beze změny (Pages nasazuje vždy celý web i s katalogem).
      # Změnila-li se pipeline nebo tento workflow, vygeneruje se nový (vydání 0.1.20 jinak čekalo
      # na noční běh a nové kategorie i aplikace z webu výrobce v katalogu chyběly)
      - name: Katalog z GitHub Pages
        id: published
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- data-pipeline src/lib/verified.ts src/lib/wingetVariant.ts .github/workflows/catalog.yml 2>/dev/null) || changed="neznámé"
          if [ -n "$changed" ]; then
            echo "Změna pipeline – vygeneruje se nový katalog:"
            echo "$changed"
            exit 0
          fi
          mkdir -p data-pipeline/out
          # Se zveřejněným katalogem i jeho zvětšené ikony (Pages by je jinak smazal)
          if curl -fsSL --compressed --retry 3 "$PAGES_CATALOG_URL" -o data-pipeline/out/catalog.json \
            && node scripts/check-catalog.mjs data-pipeline/out/catalog.json \
            && node scripts/published-icons.mjs data-pipeline/out/catalog.json data-pipeline/out/icons; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo "Zveřejněný katalog nejde použít – vygeneruje se nový"
          fi

      - run: pnpm install --frozen-lockfile
        if: steps.published.outputs.reused != 'true'

      # Každý běh uloží novou mezipaměť a další začne od poslední (staré GitHub sám maže)
      - name: Mezipaměť pipeline
        if: steps.published.outputs.reused != 'true'
        uses: actions/cache@v4
        with:
          path: data-pipeline/.cache
          key: pipeline-${{ github.run_id }}
          restore-keys: pipeline-

      # Zvětšení malých ikon (data-pipeline/src/build/upscale.ts): Real-ESRGAN (BSD-3) s ověřeným
      # součtem, Vulkan na procesoru (Mesa lavapipe), ImageMagick a cwebp z balíčků Ubuntu.
      # Když se nástroje nepodaří připravit, pipeline použije jen už zveřejněné zvětšeniny.
      - name: Nástroje pro zvětšení ikon
        if: steps.published.outputs.reused != 'true'
        continue-on-error: true
        env:
          REALESRGAN_URL: https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip
          REALESRGAN_SHA256: e5aa6eb131234b87c0c51f82b89390f5e3e642b7b70f2b9bbe95b6a285a40c96
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mesa-vulkan-drivers libvulkan1 libgomp1 imagemagick webp
          curl -fsSL --retry 3 "$REALESRGAN_URL" -o "$RUNNER_TEMP/realesrgan.zip"
          echo "$REALESRGAN_SHA256  $RUNNER_TEMP/realesrgan.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/realesrgan.zip" -d "$RUNNER_TEMP/realesrgan"
          chmod +x "$RUNNER_TEMP/realesrgan/realesrgan-ncnn-vulkan"
          # Zkouška na ukázkovém obrázku z balíčku – ověří i softwarový Vulkan
          mkdir -p "$RUNNER_TEMP/realesrgan-test"
          "$RUNNER_TEMP/realesrgan/realesrgan-ncnn-vulkan" -i "$RUNNER_TEMP/realesrgan/input2.jpg" -o "$RUNNER_TEMP/realesrgan-test/out.png" \
            -n realesrgan-x4plus-anime -m "$RUNNER_TEMP/realesrgan/models"
          test -s "$RUNNER_TEMP/realesrgan-test/out.png"
          {
            echo "REALESRGAN=$RUNNER_TEMP/realesrgan/realesrgan-ncnn-vulkan"
            echo "MAGICK=convert"
            echo "CWEBP=cwebp"
          } >> "$GITHUB_ENV"

      - name: Data pipeline
        if: steps.published.outputs.reused != 'true'
        env:
          # Hvězdičky repozitářů z GraphQL API GitHubu (veřejná data, žádná oprávnění navíc)
          GITHUB_TOKEN: ${{ github.token }}
          # Zvětšení ikon na procesoru – nejvýš tolik minut za běh, zbytek dorovnají další běhy
          UPSCALE_MINUTES: 25
        run: node data-pipeline/src/index.ts

      # Rozbitý nebo neúplný katalog se nezveřejní – aplikace by ho stáhla všem
      - name: Kontrola katalogu
        run: node scripts/check-catalog.mjs data-pipeline/out/catalog.json

      # Web je čisté HTML/CSS/JS s relativními odkazy – zveřejní se tak, jak je v repozitáři
      - name: Obsah webu
        run: |
          mkdir -p _site
          cp -R website/. _site/
          rm -f _site/vite.config.mjs
          cp data-pipeline/out/catalog.json _site/catalog.json
          # Zvětšené malé ikony, na které katalog odkazuje (hubget.eu/icons/…)
          if [ -d data-pipeline/out/icons ]; then mkdir -p _site/icons && cp -R data-pipeline/out/icons/. _site/icons/; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Zveřejnění na GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
